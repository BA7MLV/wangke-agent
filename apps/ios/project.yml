# XcodeGen 工程描述。生成 Xcode 工程：
#   brew install xcodegen
#   cd apps/ios && xcodegen
#   open WangkeAgent.xcodeproj
# 不把 .xcodeproj 提交进仓库：手写的 pbxproj 难以 review，也容易和 Xcode 版本冲突。
name: WangkeAgent
options:
  bundleIdPrefix: app.wangke
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
packages:
  WangkeKit:
    path: ../apple/WangkeKit
targets:
  WangkeAgent:
    type: application
    platform: iOS
    sources:
      - WangkeAgent
    dependencies:
      - package: WangkeKit
        product: WangkeKit
      - package: WangkeKit
        product: WangkeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wangke.agent
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 网课助手
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: WangkeAgent/Info.plist
      properties:
        # 自建服务常见的是局域网 http 地址；只放行本地网络，公网仍然要求 https。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 连接你在局域网里部署的网课助手服务。
