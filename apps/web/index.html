<!doctype html>
<html lang="zh-CN" data-wangke="1">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：Android Chrome 键盘弹出时收缩 layout 视口，
         iOS 侧由 useMobileGlobals 的 --vvh 方案兜底 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 启动兜底；运行时由页面实际边缘色同步，不能用强调蓝代替画布色。 -->
    <meta name="theme-color" content="#f0f0f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepStudent Go" />
    <meta name="description" content="导入课程视频与文档，转写字幕、整理讲义，结合原文提问和复习。" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DeepStudent Go</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
