# Optional autonomous execution layer. The Docker socket belongs only to the broker.
services:
  api:
    environment:
      SANDBOX_URL: http://sandbox-broker:3001
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}
      BOT_MAX_STEPS: ${BOT_MAX_STEPS:-100}
    depends_on:
      sandbox-broker:
        condition: service_healthy
  sandbox-broker:
    image: "${WANGKE_BROKER_IMAGE:-wangke-sandbox-broker:0.1.0}"
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}
      SANDBOX_IMAGE: "${WANGKE_SANDBOX_IMAGE:-wangke-sandbox:0.1.0}"
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
      SANDBOX_PROJECTS_DIR: /data/files/projects
      SANDBOX_UID: ${WANGKE_UID:-1000}
      SANDBOX_GID: ${WANGKE_GID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${WANGKE_HOST_DATA_DIR:-./data}:/data:ro"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  sandbox-image:
    image: "${WANGKE_SANDBOX_IMAGE:-wangke-sandbox:0.1.0}"
    profiles: [build]
